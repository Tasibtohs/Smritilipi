name: Build Smritilipi APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        validate-wrappers: false

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Regenerate Gradle Wrapper
      run: |
        GRADLE_VERSION=$(grep -oP '(?<=gradle-)[0-9.]+(?=-(bin|all)\.zip)' gradle/wrapper/gradle-wrapper.properties)
        echo "Using Gradle version: $GRADLE_VERSION"
        gradle wrapper --gradle-version "$GRADLE_VERSION"

    - name: Generate debug keystore
      run: |
        keytool -genkey -v \
          -keystore ~/.android/debug.keystore \
          -alias androiddebugkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=Android Debug,O=Android,C=US"

    - name: Decode Release Keystore
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > smritilipi-release.jks

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Smritilipi-Debug
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: Smritilipi-Release
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: warn

    - name: Create Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/*.apk
        tag_name: v1.0.${{ github.run_number }}
        name: "🌟 Smritilipi v1.0.${{ github.run_number }}"
        body: |
          <div align="center">
          
          # 📖 স্মৃতিলিপি — Smritilipi
          
          ### ✨ স্মৃতি যেখানে শব্দ হয়ে বাঁচে ✨
          
          > একটি প্রিমিয়াম বাংলা নোট অ্যাপ
          
          ---
          
          </div>
          
          ## 🌟 বৈশিষ্ট্যসমূহ
          
          | 🔥 ফিচার | 📝 বিবরণ |
          |:---:|:---|
          | **২৪টি বাংলা ফন্ট** | আপনার পছন্দমতো ফন্টে লিখুন |
          | **PDF এক্সপোর্ট** | এক ক্লিকে নোট PDF |
          | **🌙 ডার্ক মোড** | চোখের আরাম |
          | **🔒 গোপন নোট** | পাসওয়ার্ড সুরক্ষিত |
          | **💾 অটো সেভ** | লেখা হারানোর ভয় নেই |
          | **🗑️ ট্র্যাশ রিকভারি** | ভুলে মুছে ফেলা নোট ফিরে পান |
          
          ---
          
          ## 📥 ডাউনলোড ও ইন্সটল
          ১. নিচের APK ফাইলটি ডাউনলোড করুন
          ২. Unknown Sources অনুমতি দিন
          ৩. ইন্সটল করে লেখা শুরু করুন
          
          ---
          
          ## 🔄 সর্বশেষ আপডেট — v1.0.1
          
          - ✅ ফন্ট লোডিং ফিক্স
          - ✅ PDF সাদা পেজ ফিক্স
          - ✅ বাংলা ফন্ট রেন্ডারিং উন্নত
          - ✅ ডার্ক মোড স্থিতিশীল
          
          ---
          
          ## 🔒 গোপনীয়তা
          
          > 🔐 **১০০% প্রাইভেট**
          > - সম্পূর্ণ অফলাইন
          > - কোনো ডেটা সার্ভারে যায় না
          > - আপনার নোট শুধু আপনার ফোনে
          
          ---
          
          ## 📱 প্রয়োজনীয়তা
          
          | বিষয় | তথ্য |
          |:---:|:---:|
          | Android | 7.0+ |
          | RAM | 2GB+ |
          | Storage | 50MB |
          
          ---
          
          ## 🌐 ওপেন সোর্স
          
          [![GitHub](https://img.shields.io/badge/GitHub-Repository-black?style=flat&logo=github)](https://github.com/Tasibtohs/Smritilipi)
          
          **MIT License** — স্বাধীনভাবে ব্যবহার করুন, পরিবর্তন করুন, শেয়ার করুন।
          
          ---
          
          <div align="center">
          
          ### 💖 ধন্যবাদ Smritilipi ব্যবহার করার জন্য!
          
          **👇 নিচের APK ফাইলটি ডাউনলোড করে আজই শুরু করুন!**
          
          </div>
draft: false
prerelease: false
env:
GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
