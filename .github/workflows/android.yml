name: Build Smritilipi APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        validate-wrappers: false

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Regenerate Gradle Wrapper
      run: |
        GRADLE_VERSION=$(grep -oP '(?<=gradle-)[0-9.]+(?=-(bin|all)\.zip)' gradle/wrapper/gradle-wrapper.properties)
        echo "Using Gradle version: $GRADLE_VERSION"
        gradle wrapper --gradle-version "$GRADLE_VERSION"

    - name: Generate debug keystore
      run: |
        keytool -genkey -v \
          -keystore ~/.android/debug.keystore \
          -alias androiddebugkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=Android Debug,O=Android,C=US"

    - name: Decode Release Keystore
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > smritilipi-release.jks

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Smritilipi-Debug
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: Smritilipi-Release
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: warn

    - name: Create Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/*.apk
        tag_name: v1.0.${{ github.run_number }}
        name: "Smritilipi v1.0.${{ github.run_number }}"
        body: |
          # Smritilipi - Bangla Note App
          
          ## Features
          - 24 Bangla Fonts
          - PDF Export
          - Dark/Light Theme
          - Hidden Notes
          - Auto Save
          - Trash Recovery
          
          ## Download
          Download the APK below and install.
          
          ## Update v1.0.1
          - Font loading fixed
          - PDF white page fixed
          - Dark mode stable
          
          ## Privacy
          - 100% Offline
          - No data collection
          
          ## Open Source
          https://github.com/Tasibtohs/Smritilipi
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
